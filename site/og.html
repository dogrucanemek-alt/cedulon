<!DOCTYPE html>
<!--
  Source of og.png. Render at exactly 1200x630 with headless Chrome:

    chrome --headless=new --window-size=1200,630 --hide-scrollbars \
      --screenshot=site/og.png file:///path/to/site/og.html

  The mark (og-mark.png) sits on a black square; mix-blend-mode: screen drops
  the black and keeps the glow, so no alpha channel is needed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cedulon share image</title>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #ffffff;
        background:
          radial-gradient(ellipse 70% 90% at 82% 45%, #0b2a66 0%, rgba(11, 42, 102, 0) 60%),
          linear-gradient(135deg, #04070f 0%, #06122b 55%, #0a1d4a 100%);
      }
      .text { position: absolute; left: 82px; top: 118px; width: 660px; }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -1.5px;
      }
      .tagline {
        margin: 18px 0 0;
        font-size: 32px;
        line-height: 1.2;
        color: #3d9cff;
      }
      .lede { margin: 44px 0 0; font-size: 26px; line-height: 1.3; color: #e6ecf5; }
      .body { margin: 22px 0 0; font-size: 24px; line-height: 1.45; color: #d2d9e5; max-width: 560px; }
      .meta { margin: 38px 0 0; font-size: 22px; color: #e6ecf5; }
      .meta span { color: #8a94a6; margin: 0 10px; }
      .url { margin: 40px 0 0; font-size: 24px; color: #3d9cff; }
      .mark {
        position: absolute;
        right: 148px;
        top: 130px;
        width: 300px;
        height: 300px;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>Cedulon</h1>
      <p class="tagline">Missing evidence is itself evidence.</p>
      <p class="lede">The open audit layer for agent-to-agent payments.</p>
      <p class="body">Every spend carries a signed receipt; the chain is reconciled against the rail's own ledger.</p>
      <p class="meta">Open source (Apache-2.0)<span>·</span>three IETF Internet-Drafts</p>
      <p class="url">cedulon.com</p>
    </div>
    <img class="mark" src="og-mark.png" alt="">
  </body>
</html>
