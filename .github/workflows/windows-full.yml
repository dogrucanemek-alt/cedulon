# The full pre-release suite on Windows, on a hosted runner neither party
# keeps. At the current commit the hosted run skips nothing (measured on
# the runner, none skipped); a local run without symbolic-link privilege
# skips four POSIX-mode cases with a stated reason, and the first hosted
# run measured 310 of 314 before the cases were reworked. Either way a
# green run is a smaller claim than posix-full or macos-full, and it is
# counted as exactly that; docs/RUN_AS_VERIFIER.md says which cases and why.
#
# This job was withheld while a fresh Windows clone was believed to fail the
# line-ending guard. That belief went stale: the guard reads the object
# store, not the working tree, and a fresh core.autocrlf=true clone was
# measured running the whole suite green before this job was added.
name: windows-full

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: show the line-ending and temp configuration this runner actually has
        shell: bash
        run: |
          echo "autocrlf=$(git config core.autocrlf || echo unset)"
          node -e "const {tmpdir}=require('os'); console.log('tmpdir', tmpdir());"
      - run: npm ci --ignore-scripts
      - run: npm run test:pre-release
