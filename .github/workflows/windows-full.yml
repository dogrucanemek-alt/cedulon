# The full pre-release suite on Windows, on a hosted runner neither party
# keeps. The POSIX-mode cases (40 60 68 75) skip here with a stated reason:
# file and directory modes are not the access control on this platform. The
# symbolic-link cases assert when the runner may create symlinks — the first
# run measured exactly that, 310 of 314 — and skip with the same discipline
# where it may not. Either way a green run is a smaller claim than
# posix-full or macos-full, and it is counted as exactly that;
# docs/RUN_AS_VERIFIER.md says which cases and why.
#
# This job was withheld while a fresh Windows clone was believed to fail the
# line-ending guard. That belief went stale: the guard reads the object
# store, not the working tree, and a fresh core.autocrlf=true clone was
# measured running the whole suite green before this job was added.
name: windows-full

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: show the line-ending and temp configuration this runner actually has
        shell: bash
        run: |
          echo "autocrlf=$(git config core.autocrlf || echo unset)"
          node -e "const {tmpdir}=require('os'); console.log('tmpdir', tmpdir());"
      - run: npm ci --ignore-scripts
      - run: npm run test:pre-release
