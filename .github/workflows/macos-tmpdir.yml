# Measures the macOS default temp root (usually /var/folders → /private/var).
# A local Docker /link-tmp is not this path. Do not set TMPDIR here.
name: macos-default-tmpdir

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "packages/mcp-server/**"
      - "tests/session-state.test.ts"
      - "tests/trust-root-pass5.test.ts"
      - "tests/trust-root-pass6.test.ts"
      - "tests/trust-root-pass7.test.ts"
      - ".github/workflows/macos-tmpdir.yml"

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: show the temp root this runner actually has
        run: |
          node -e "const {tmpdir}=require('os'); const {realpathSync}=require('fs'); const t=tmpdir(); console.log('tmpdir', t); console.log('realpath', realpathSync(t));"
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - name: session and lock cases under the default TMPDIR
        run: |
          node --experimental-strip-types --test \
            tests/session-state.test.ts \
            tests/trust-root-pass5.test.ts \
            tests/trust-root-pass6.test.ts \
            tests/trust-root-pass7.test.ts
