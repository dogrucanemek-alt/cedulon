# The full pre-release suite on macOS, under the default temp root
# (usually /var/folders → /private/var). Do not set TMPDIR here: that path
# is the thing being measured, and a local Docker /link-tmp is not it.
#
# macos-default-tmpdir.yml ran four files and nothing said so. Three green
# checks read as three full runs, and a reader of docs/STATUS.md had no way
# to learn otherwise. An implementer asked for the platform-specific CI
# subsets to be distinguished from the full-suite acceptance target; the
# honest way to answer that is to stop having a subset here.
#
# Linux is posix-full.yml. Windows is windows-full.yml: its POSIX-mode and
# symlink cases skip there with stated reasons where the platform cannot
# measure them, so its green is a smaller claim than either of these, and
# it is stated as such rather than counted as equal.
name: macos-full

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: refuse root
        run: |
          test "$(id -u)" != "0"
          echo "uid=$(id -u) user=$(id -un)"
      - name: show the temp root this runner actually has
        run: |
          node -e "const {tmpdir}=require('os'); const {realpathSync}=require('fs'); const t=tmpdir(); console.log('tmpdir', t); console.log('realpath', realpathSync(t));"
      - run: npm ci --ignore-scripts
      - run: npm run test:pre-release
