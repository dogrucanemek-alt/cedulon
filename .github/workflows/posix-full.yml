# Full pre-release suite as a non-root user, on Linux.
# macos-full.yml is the same suite on the macOS default temp root; it
# replaced a four-file job that read as a full run and was not one.
# posix-nonroot.yml still runs only 76|80|81, deliberately: it is the
# uid-1001 case, not a coverage claim.
#
# Do not add a Windows runner as the only full-suite job. The hosted
# Windows job skips nothing at the time of writing, but a local Windows
# run without symbolic-link privilege skips four POSIX-mode cases, so a
# green Windows job alone is a smaller claim than a green POSIX job. A
# Windows job is only meaningful beside this one.
name: posix-full

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: refuse root
        run: |
          test "$(id -u)" != "0"
          echo "uid=$(id -u) user=$(id -un)"
      - run: npm ci --ignore-scripts
      - run: npm run test:pre-release
