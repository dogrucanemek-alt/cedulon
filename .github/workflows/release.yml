# Publishes the nine public packages from a tag, with no token on anyone's
# laptop. npm trusted publishing exchanges the workflow's OIDC identity for a
# short-lived credential, so there is nothing long-lived to leak and no
# one-time password to type nine times.
#
# One-time setup on npmjs.com, per package: Settings -> Trusted publisher ->
# GitHub Actions, repository dogrucanemek-alt/cedulon, workflow release.yml.
# Until that is done for a package, its publish step fails with a permission
# error rather than falling back to anything weaker.
#
# The MCP Registry and GitHub Release bundle steps sit after npm publish,
# the npm readback, and the post-release suite. A tag that reached npm and
# then failed those later steps is still a completed npm release; the later
# steps do not roll it back. finish mode exists to complete those leftover
# steps on the same version — it does not publish to npm.
name: release

# The tag path is unchanged: push of v* runs publish, then registry, then
# the GitHub release. A manual dispatch used to be a second publish path
# (github.ref on a branch, tag guard skipped, npm publish ran). Dispatch is
# back only as finish: it attaches the registry entry and the desktop
# bundle to a version already on npm. There is still no second way to publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "finish = complete the MCP Registry entry and GitHub release for a version already on npm. Does not publish to npm."
        required: true
        type: choice
        options:
          - finish
      version:
        description: "Already-published version to finish, without the v prefix (e.g. 0.13.1)"
        required: true
        type: string

# Default is read. id-token: write is only on publish and finish (npm
# trusted publishing and mcp-publisher login github-oidc). contents: write
# is only on release (gh release create / upload).
permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # A cached store can hand the build an artifact the tag did not
          # produce. A release resolves from nothing.
          package-manager-cache: false

      - run: npm ci

      # A tag that does not match the workspace is how you ship 0.5.0 while
      # believing you shipped 0.6.0. Checked before anything is built.
      - name: the tag names the version every package carries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag says $tag"
          fail=0
          for f in packages/*/package.json; do
            name=$(node -p "require('./$f').name")
            ver=$(node -p "require('./$f').version")
            if [ "$ver" != "$tag" ]; then
              echo "  $name is $ver, tag says $tag"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "refusing to ship a tag that disagrees with the tree"
            exit 1
          fi

      - run: npm run build:packages

      # Everything that can be true before the registry has heard of this
      # version. The later gate is separate, because a suite that cannot be
      # green until after the irreversible step is a suite nobody can read.
      - run: npm run test:pre-release
      - run: npm run guard:claims
      - run: npm run guard:crlf

      # A package that has never been published cannot go out through
      # trusted publishing: the publisher is configured on the package's own
      # settings page, which exists only after a first publish. Checked
      # before anything is sent, so a missing package fails here rather than
      # halfway through the loop with the first packages at the new version
      # and audit still at the old one. effect-extract entered the workspace
      # with the decision profile and had never been published when this
      # step was written.
      - name: every package already exists on npm
        run: |
          fail=0
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            if npm view "@cedulon/$p" version >/dev/null 2>&1; then
              echo "  @cedulon/$p exists"
            else
              echo "  @cedulon/$p has never been published; publish it once by hand and configure its trusted publisher before tagging"
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      # Dependency order. Reversed, npm cannot resolve what it is asked to
      # install. base-extract and mcp-guard are private and stay unshipped.
      - name: send them in dependency order
        run: |
          set -e
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            echo "=== @cedulon/$p ==="
            npm publish -w "@cedulon/$p" --provenance
          done

      # Read back from the registry rather than from this checkout.
      # The registry is read-after-write eventual, not immediate. A fixed
      # sleep then one ask is how v0.13.1 reached npm and still went red:
      # npm's own publish reply said the package "may take a few minutes to
      # become available", fifteen seconds was not that, and the leftover
      # registry and GitHub release steps were skipped. A per-package
      # attempt cap of ten (150s) is the same defect with more sleeps.
      # Shared 480s bound: npm said "a few minutes"; v0.13.0 tarballs were
      # 404 for about eight minutes behind the CDN. All nine packages are
      # asked (v0.8.0: six answered, audit still served the old version).
      # Asking only the last package in the publish order would have
      # missed that. Fail stays red; the message points at finish mode.
      - name: the registry answers with this version
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          deadline=$((SECONDS + 480))
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            got=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              got=$(npm view "@cedulon/$p@$tag" version 2>/dev/null || echo "")
              if [ "$got" = "$tag" ]; then
                echo "  @cedulon/$p@$tag -> $got"
                break
              fi
              echo "  @cedulon/$p@$tag -> ${got:-no answer} (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            if [ "$got" != "$tag" ]; then
              echo "@cedulon/$p@$tag was published but npm has not served this version after ${SECONDS}s."
              echo "Re-run this workflow in finish mode with version=$tag — finish does not publish to npm."
              exit 1
            fi
          done

      # v0.13.0: the metadata said 0.13.0 while two tarballs answered 404
      # behind the CDN for about eight minutes, and the bundle job's npm
      # install failed on them. The version is a number; the install needs
      # the bytes. Same shared 480s bound as the version readback.
      - name: every tarball of this version answers
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          deadline=$((SECONDS + 480))
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            tarball=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              tarball=$(npm view "@cedulon/$p@$tag" dist.tarball 2>/dev/null || echo "")
              [ -n "$tarball" ] && break
              echo "  @cedulon/$p@$tag names no tarball yet (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            [ -n "$tarball" ] || {
              echo "@cedulon/$p@$tag names no tarball after ${SECONDS}s."
              echo "Re-run this workflow in finish mode with version=$tag — finish does not publish to npm."
              exit 1
            }
            code=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$tarball" || echo "000")
              [ "$code" = "200" ] && break
              echo "  @cedulon/$p tarball -> HTTP $code (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            echo "  @cedulon/$p tarball -> HTTP $code"
            [ "$code" = "200" ] || {
              echo "tarball for @cedulon/$p@$tag still answers $code after ${SECONDS}s."
              echo "Re-run this workflow in finish mode with version=$tag — finish does not publish to npm."
              exit 1
            }
          done

      # test:post-release used to sit here. It compares STATUS with npm and is
      # red on every tagged run by design, because STATUS moves after the
      # publish; the first tag that carried the registry and bundle steps
      # (v0.12.0) never reached them for that reason. It has its own job now.

      # mcp-publisher 1.8.1. Digest from the release checksums file:
      # https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt
      #   a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz
      # Recomputed locally 2026-09-03; same digest. ubuntu-latest is x86_64;
      # any other arch fails rather than fetching an unpinned latest.
      - name: install pinned mcp-publisher
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -e
          arch=$(uname -m)
          [ "$arch" = "x86_64" ] || { echo "pinned linux_amd64 digest; runner is $arch"; exit 1; }
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      # Official login for Actions: `mcp-publisher login github-oidc`.
      # Documented at docs/reference/cli/commands.md and
      # docs/modelcontextprotocol-io/github-actions.mdx in
      # github.com/modelcontextprotocol/registry. Requires id-token: write.
      # Publish takes server.json; no --dry-run flag exists on publish
      # (validate is a separate command and does not publish).
      - name: publish server.json to the MCP Registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          sj=$(node -p "require('./server.json').version")
          if [ "$sj" != "$tag" ]; then
            echo "server.json is $sj, tag says $tag; refusing to publish"
            exit 1
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Official readback: GET /v0.1/servers/{name}/versions/{version} on
      # https://registry.modelcontextprotocol.io (docs/reference/api/official-registry-api.md).
      # isLatest is _meta.io.modelcontextprotocol.registry/official.isLatest
      # (openapi.yaml). Same shared 480s bound as the npm readback.
      - name: the MCP Registry answers with this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          encoded="io.github.dogrucanemek-alt%2Fcedulon"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${tag}"
          got=""
          latest=""
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsS "$url" || echo "")
            if [ -n "$body" ]; then
              got=$(printf '%s' "$body" | node -e '
                let raw = "";
                process.stdin.on("data", (c) => { raw += c; });
                process.stdin.on("end", () => {
                  try {
                    const b = JSON.parse(raw);
                    const v = b.server && b.server.version ? b.server.version : "";
                    const latest = b._meta && b._meta["io.modelcontextprotocol.registry/official"] && b._meta["io.modelcontextprotocol.registry/official"].isLatest === true;
                    process.stdout.write(v + " " + (latest ? "true" : "false"));
                  } catch {
                    process.stdout.write(" ");
                  }
                });
              ')
              ver=${got%% *}
              latest=${got#* }
              [ "$ver" = "$tag" ] && [ "$latest" = "true" ] && break
            fi
            echo "  MCP Registry -> ${got:-no answer} (waiting, ${SECONDS}s elapsed of 480)"
            sleep 15
          done
          echo "  MCP Registry -> $got"
          ver=${got%% *}
          latest=${got#* }
          [ "$ver" = "$tag" ] && [ "$latest" = "true" ] || {
            echo "MCP Registry still says version=${ver:-nothing} isLatest=${latest:-nothing} after ${SECONDS}s, tag says $tag"
            echo "Re-run this workflow in finish mode with version=$tag — finish does not publish to npm."
            exit 1
          }

  # finish does the leftover half of a tag run that already reached npm:
  # the MCP Registry entry and (via the release job) the desktop bundle.
  # It does not publish to npm. v0.13.1 is the case it exists for.
  finish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'finish'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: resolve the version this run finishes
        id: ver
        run: |
          set -e
          raw="${{ github.event.inputs.version }}"
          V="${raw#v}"
          if [ -z "$V" ]; then
            echo "finish mode needs the version input (e.g. 0.13.1)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "finishing $V"

      # L3: finish attaches to an existing release, it does not create one.
      # Same shared 480s bound as the tag-path readback, because the reason
      # to be here is often that npm has the bytes and has not served them
      # yet. After the bound the message is the refusal, not a publish.
      - name: this version is already on npm
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          deadline=$((SECONDS + 480))
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            got=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              got=$(npm view "@cedulon/$p@$V" version 2>/dev/null || echo "")
              if [ "$got" = "$V" ]; then
                echo "  @cedulon/$p@$V -> $got"
                break
              fi
              echo "  @cedulon/$p@$V -> ${got:-no answer} (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            if [ "$got" != "$V" ]; then
              echo "@cedulon/$p@$V is not on npm — finish mode attaches to an existing release, it does not create one"
              exit 1
            fi
          done

      - name: install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -e
          arch=$(uname -m)
          [ "$arch" = "x86_64" ] || { echo "pinned linux_amd64 digest; runner is $arch"; exit 1; }
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      # Run 34607440005: 0.13.1 was already on the registry (published by
      # hand after the tagged run never reached this step). Publishing
      # again returned 400 duplicate version and the GitHub release never
      # ran. Ask the registry first; a listed version is a success, not a
      # red. A racing publish that loses to the same duplicate is also a
      # success. Any other publisher error stays red.
      - name: publish server.json to the MCP Registry
        run: |
          set -e
          tag="${{ steps.ver.outputs.version }}"
          sj=$(node -p "require('./server.json').version")
          if [ "$sj" != "$tag" ]; then
            echo "server.json is $sj, finish mode was asked for $tag; refusing to publish"
            exit 1
          fi
          encoded="io.github.dogrucanemek-alt%2Fcedulon"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${tag}"
          code=$(curl -sS -o "$RUNNER_TEMP/mcp-reg.json" -w '%{http_code}' "$url" || echo "000")
          listed=""
          if [ "$code" = "200" ]; then
            listed=$(node -e '
              const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const v = b.server && b.server.version ? b.server.version : "";
              const official = b._meta && b._meta["io.modelcontextprotocol.registry/official"];
              const latest = official && official.isLatest === true;
              process.stdout.write(v + " " + (latest ? "true" : "false"));
            ' "$RUNNER_TEMP/mcp-reg.json")
          fi
          ver=${listed%% *}
          latest=${listed#* }
          if [ "$ver" = "$tag" ]; then
            echo "MCP Registry already lists $tag (isLatest=${latest:-unknown}); skipping publish"
          else
            echo "MCP Registry does not list $tag yet (HTTP $code); publishing"
            ./mcp-publisher login github-oidc
            set +e
            out=$(./mcp-publisher publish 2>&1)
            ec=$?
            set -e
            printf '%s\n' "$out"
            if [ "$ec" -eq 0 ]; then
              echo "published $tag to the MCP Registry"
            elif printf '%s' "$out" | grep -F -q 'cannot publish duplicate version'; then
              echo "MCP Registry rejected $tag as a duplicate version; treating as already listed"
            else
              echo "mcp-publisher publish failed"
              exit "$ec"
            fi
          fi

      - name: the MCP Registry answers with this version
        run: |
          set -e
          tag="${{ steps.ver.outputs.version }}"
          encoded="io.github.dogrucanemek-alt%2Fcedulon"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded}/versions/${tag}"
          got=""
          latest=""
          deadline=$((SECONDS + 480))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsS "$url" || echo "")
            if [ -n "$body" ]; then
              got=$(printf '%s' "$body" | node -e '
                let raw = "";
                process.stdin.on("data", (c) => { raw += c; });
                process.stdin.on("end", () => {
                  try {
                    const b = JSON.parse(raw);
                    const v = b.server && b.server.version ? b.server.version : "";
                    const latest = b._meta && b._meta["io.modelcontextprotocol.registry/official"] && b._meta["io.modelcontextprotocol.registry/official"].isLatest === true;
                    process.stdout.write(v + " " + (latest ? "true" : "false"));
                  } catch {
                    process.stdout.write(" ");
                  }
                });
              ')
              ver=${got%% *}
              latest=${got#* }
              [ "$ver" = "$tag" ] && [ "$latest" = "true" ] && break
            fi
            echo "  MCP Registry -> ${got:-no answer} (waiting, ${SECONDS}s elapsed of 480)"
            sleep 15
          done
          echo "  MCP Registry -> $got"
          ver=${got%% *}
          latest=${got#* }
          [ "$ver" = "$tag" ] && [ "$latest" = "true" ] || {
            echo "MCP Registry still says version=${ver:-nothing} isLatest=${latest:-nothing} after ${SECONDS}s, finish was asked for $tag"
            exit 1
          }

  # The STATUS-versus-npm check, on its own so its expected red on the tagged
  # run blocks nothing: STATUS is moved by hand after the publish and this
  # job is the reminder that it has not been yet.
  post-release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:post-release

  release:
    needs: [publish, finish]
    if: |
      always() && !cancelled() && (
        (startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'finish' && needs.finish.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: resolve the version this run finishes
        id: ver
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
            V="${raw#v}"
            if [ -z "$V" ]; then
              echo "finish mode needs the version input (e.g. 0.13.1)"
              exit 1
            fi
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Builds from the published npm package, not the working tree, so this
      # job depends on publish having completed the npm readback (tag path)
      # or finish having seen the version on npm (finish path). The
      # readback probed the tarballs once; a CDN can still answer 404 to
      # this runner after answering 200 to that one, so it asks again here,
      # right before the install that needs them.
      - name: every tarball of this version answers from this runner
        run: |
          set -e
          tag="${{ steps.ver.outputs.version }}"
          deadline=$((SECONDS + 480))
          for p in cose core receipts manifest checkpoint x402-adapter effect-extract audit mcp-server; do
            tarball=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              tarball=$(npm view "@cedulon/$p@$tag" dist.tarball 2>/dev/null || echo "")
              [ -n "$tarball" ] && break
              echo "  @cedulon/$p@$tag names no tarball yet (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            [ -n "$tarball" ] || { echo "@cedulon/$p@$tag names no tarball after ${SECONDS}s"; exit 1; }
            code=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$tarball" || echo "000")
              [ "$code" = "200" ] && break
              echo "  @cedulon/$p tarball -> HTTP $code (waiting, ${SECONDS}s elapsed of 480)"
              sleep 15
            done
            [ "$code" = "200" ] || { echo "tarball for @cedulon/$p@$tag still answers $code after ${SECONDS}s"; exit 1; }
          done

      - name: build the desktop bundle
        run: npm run mcpb

      - name: the manifest version is the tag
        run: |
          set -e
          tag="${{ steps.ver.outputs.version }}"
          bundle="build/cedulon-${tag}.mcpb"
          [ -f "$bundle" ] || { echo "bundle $bundle was not produced"; exit 1; }
          ver=$(unzip -p "$bundle" manifest.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          echo "manifest version $ver, tag says $tag"
          if [ "$ver" != "$tag" ]; then
            echo "refusing to attach a bundle whose manifest version is not the tag"
            exit 1
          fi

      - name: attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ steps.ver.outputs.version }}"
          release_tag="${{ steps.ver.outputs.tag }}"
          bundle="build/cedulon-${tag}.mcpb"
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          echo "bundle sha256 $bundle_sha"
          # The whole UPGRADING section for this version, by the tested
          # script (tests/release-notes.test.ts), plus the bundle digest.
          # A first cut took the first paragraph only and left an existing
          # release's notes untouched; both paths now write the same notes.
          notes=$(mktemp)
          {
            node --experimental-strip-types scripts/release-notes.ts "$tag" docs/UPGRADING.md
            echo
            echo "Bundle SHA-256: $bundle_sha"
          } > "$notes"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$bundle" --clobber
          else
            gh release create "$release_tag" "$bundle" --verify-tag --title "$release_tag" --notes-file "$notes"
          fi
          gh release edit "$release_tag" --notes-file "$notes"
          empty=$(mktemp -d)
          gh release download "$release_tag" --pattern "cedulon-${tag}.mcpb" --dir "$empty"
          echo "$bundle_sha  $empty/cedulon-${tag}.mcpb" | sha256sum -c -
